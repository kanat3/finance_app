services:
  db:
    image: postgres:16-alpine
    container_name: traty_db
    environment:
      POSTGRES_USER: traty
      POSTGRES_PASSWORD: traty
      POSTGRES_DB: traty
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traty -d traty"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
    container_name: traty_app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://traty:traty@db:5432/traty
      FRONTEND_DIST: /app/frontend_dist
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: traty_redis
    environment:
      - TZ=${TZ:-Europe/Moscow}
    ports:
      - "6379:6379"
    restart: unless-stopped

  celery-worker:
    build: .
    container_name: traty_celery_worker
    working_dir: /app          # <-- ДОБАВИТЬ
    command: celery -A celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://traty:traty@db:5432/traty
      - REDIS_URL=redis://redis:6379/0
      - TZ=${TZ:-Europe/Moscow}
    depends_on:
      - redis
      - db
    restart: unless-stopped

  celery-beat:
    build: .
    container_name: traty_celery_beat
    working_dir: /app          # <-- ДОБАВИТЬ
    command: celery -A celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://traty:traty@db:5432/traty
      - REDIS_URL=redis://redis:6379/0
      - TZ=${TZ:-Europe/Moscow}
      - RUN_SEED=${RUN_SEED:-0}
    depends_on:
      - redis
      - db
    restart: unless-stopped

volumes:
  db_data: